services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: inventory_demo
      POSTGRES_DB: inventory_case2
    ports:
      - "127.0.0.1:55434:5432"
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ./defense.sql:/defense/defense.sql:ro
      - ./sql:/defense/sql:ro
      - ./sql/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./sql/02_operations.sql:/docker-entrypoint-initdb.d/02_operations.sql:ro
      - ./sql/03_demo.sql:/docker-entrypoint-initdb.d/03_demo.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d inventory_case2"]
      interval: 2s
      timeout: 2s
      retries: 15
