services:
  db:
    image: postgres:17-alpine
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - max_wal_senders=5
      - -c
      - max_replication_slots=5
      - -c
      - max_slot_wal_keep_size=1GB
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: inventory_demo
      POSTGRES_DB: inventory_case2
      REPLICATION_PASSWORD: inventory_replication_demo
    ports:
      - "127.0.0.1:55434:5432"
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ./defense.sql:/defense/defense.sql:ro
      - ./sql:/defense/sql:ro
      - ./docker/00_replication.sh:/docker-entrypoint-initdb.d/00_replication.sh:ro
      - ./sql/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./sql/02_operations.sql:/docker-entrypoint-initdb.d/02_operations.sql:ro
      - ./sql/03_demo.sql:/docker-entrypoint-initdb.d/03_demo.sql:ro
      - ./sql/06_transfers.sql:/docker-entrypoint-initdb.d/06_transfers.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d inventory_case2"]
      interval: 2s
      timeout: 2s
      retries: 15
  replica:
    image: postgres:17-alpine
    entrypoint: ["sh", "/replica-entrypoint.sh"]
    environment:
      PGDATA: /var/lib/postgresql/data/standby
      PGPASSWORD: inventory_replication_demo
    ports:
      - "127.0.0.1:55435:5432"
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ./docker/replica-entrypoint.sh:/replica-entrypoint.sh:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "psql -U postgres -d inventory_case2 -Atc 'SELECT pg_is_in_recovery()' | grep -qx t"]
      interval: 2s
      timeout: 2s
      retries: 30
