<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img"><title>Гонка двух покупателей за последнюю единицу</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6A7C91"/></marker></defs>
<rect width="1280" height="760" fill="#FFFFFF"/><g font-family="Arial, sans-serif" fill="#182431">
<text x="50" y="48.0" font-size="34" font-weight="700" fill="#182431">Последняя единица: один победитель</text>
<text x="50" y="88.0" font-size="24" font-weight="400" fill="#526172">Одна строка primary: on_hand = 1, reserved = 0, available = 1</text>
<rect x="60" y="135" width="530" height="80" rx="18" fill="#F1F5F9" stroke="#D8E1EB"/>
<text x="80" y="171.0" font-size="25" font-weight="700" fill="#1769B8">Покупатель A</text>
<rect x="690" y="135" width="530" height="80" rx="18" fill="#F1F5F9" stroke="#D8E1EB"/>
<text x="710" y="171.0" font-size="25" font-weight="700" fill="#1769B8">Покупатель B</text>
<rect x="60" y="250" width="530" height="95" rx="18" fill="#E5F4EA" stroke="#D8E1EB"/>
<text x="80" y="286.0" font-size="25" font-weight="700" fill="#217544">UPDATE проходит</text>
<text x="80" y="326.0" font-size="22" font-weight="400" fill="#182431">Строка заблокирована, reserved = 1</text>
<rect x="690" y="250" width="530" height="95" rx="18" fill="#FFF6DF" stroke="#D8E1EB"/>
<text x="710" y="286.0" font-size="25" font-weight="700" fill="#8A6100">UPDATE ждёт</text>
<text x="710" y="326.0" font-size="22" font-weight="400" fill="#182431">Та же строка уже занята транзакцией A.</text>
<polyline points="325,215 325,250" fill="none" stroke="#6A7C91" stroke-width="2.7" marker-end="url(#arrow)"/>
<polyline points="955,215 955,250" fill="none" stroke="#6A7C91" stroke-width="2.7" marker-end="url(#arrow)"/>
<rect x="60" y="400" width="530" height="90" rx="18" fill="#E5F4EA" stroke="#D8E1EB"/>
<text x="80" y="436.0" font-size="25" font-weight="700" fill="#217544">COMMIT</text>
<text x="80" y="476.0" font-size="22" font-weight="400" fill="#182431">Резерв A зафиксирован.</text>
<polyline points="325,345 325,400" fill="none" stroke="#6A7C91" stroke-width="2.7" marker-end="url(#arrow)"/>
<rect x="690" y="430" width="530" height="125" rx="18" fill="#F1F5F9" stroke="#D8E1EB"/>
<text x="710" y="466.0" font-size="25" font-weight="700" fill="#1769B8">Перепроверка WHERE</text>
<text x="710" y="506.0" font-size="22" font-weight="400" fill="#182431">on_hand − reserved &gt;= 1</text>
<text x="710" y="535.7" font-size="22" font-weight="400" fill="#182431">1 − 1 &gt;= 1  →  ложь</text>
<polyline points="955,345 955,430" fill="none" stroke="#6A7C91" stroke-width="2.7" marker-end="url(#arrow)"/>
<polyline points="590,445 640,445 640,480 690,480" fill="none" stroke="#6A7C91" stroke-width="2.7" marker-end="url(#arrow)"/>
<text x="425" y="525.0" font-size="20" font-weight="400" fill="#526172">A освободил блокировку</text>
<rect x="60" y="580" width="530" height="85" rx="18" fill="#E5F4EA" stroke="#D8E1EB"/>
<text x="80" y="616.0" font-size="25" font-weight="700" fill="#217544">A: резерв создан</text>
<rect x="690" y="580" width="530" height="85" rx="18" fill="#FCEAE8" stroke="#D8E1EB"/>
<text x="710" y="616.0" font-size="25" font-weight="700" fill="#B23C35">B: ошибка и ROLLBACK</text>
<polyline points="325,490 325,580" fill="none" stroke="#6A7C91" stroke-width="2.7" marker-end="url(#arrow)"/>
<polyline points="955,555 955,580" fill="none" stroke="#6A7C91" stroke-width="2.7" marker-end="url(#arrow)"/>
<text x="60" y="721.0" font-size="23" font-weight="700" fill="#182431">Если A откатывается вместо COMMIT, B может получить освободившуюся единицу.</text>
</g></svg>