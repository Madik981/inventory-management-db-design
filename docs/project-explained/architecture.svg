<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="680" viewBox="0 0 1280 680" role="img"><title>Компоненты Inventory Management</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6A7C91"/></marker></defs>
<rect width="1280" height="680" fill="#FFFFFF"/><g font-family="Arial, sans-serif" fill="#182431">
<text x="50" y="48.0" font-size="34" font-weight="700" fill="#182431">Кто за что отвечает в проекте</text>
<text x="50" y="85.0" font-size="23" font-weight="400" fill="#526172">Все решения о резервировании проходят через один primary.</text>
<rect x="50" y="175" width="280" height="130" rx="18" fill="#F1F5F9" stroke="#D8E1EB"/>
<text x="70" y="211.0" font-size="25" font-weight="700" fill="#1769B8">Приложения A / B</text>
<text x="70" y="251.0" font-size="23" font-weight="400" fill="#182431">InventoryClient</text>
<text x="70" y="282.05" font-size="23" font-weight="400" fill="#182431">или SQL-сессии</text>
<rect x="480" y="175" width="320" height="130" rx="18" fill="#E5F4EA" stroke="#D8E1EB"/>
<text x="500" y="211.0" font-size="25" font-weight="700" fill="#217544">Primary PostgreSQL</text>
<text x="500" y="251.0" font-size="23" font-weight="400" fill="#182431">Остатки, резервы,</text>
<text x="500" y="282.05" font-size="23" font-weight="400" fill="#182431">перемещения, outbox</text>
<rect x="950" y="175" width="280" height="130" rx="18" fill="#F1F5F9" stroke="#D8E1EB"/>
<text x="970" y="211.0" font-size="25" font-weight="700" fill="#1769B8">Replica / standby</text>
<text x="970" y="251.0" font-size="23" font-weight="400" fill="#182431">Физическая копия</text>
<text x="970" y="282.05" font-size="23" font-weight="400" fill="#182431">для чтений</text>
<polyline points="330,240 480,240" fill="none" stroke="#6A7C91" stroke-width="2.7" marker-end="url(#arrow)"/>
<text x="350" y="222.0" font-size="20" font-weight="400" fill="#1769B8">SQL-запись</text>
<polyline points="800,240 950,240" fill="none" stroke="#6A7C91" stroke-width="2.7" marker-end="url(#arrow)"/>
<text x="844" y="222.0" font-size="20" font-weight="400" fill="#1769B8">WAL</text>
<polyline points="190,175 190,125 1090,125 1090,175" fill="none" stroke="#6A7C91" stroke-width="2.7" marker-end="url(#arrow)" stroke-dasharray="8 6"/>
<text x="380" y="115.0" font-size="20" font-weight="400" fill="#526172">Чтение: replica после проверки или primary</text>
<rect x="50" y="435" width="280" height="135" rx="18" fill="#F1F5F9" stroke="#D8E1EB"/>
<text x="70" y="471.0" font-size="25" font-weight="700" fill="#1769B8">Expiry worker</text>
<text x="70" y="511.0" font-size="23" font-weight="400" fill="#182431">Освобождает</text>
<text x="70" y="542.05" font-size="23" font-weight="400" fill="#182431">истёкшие резервы</text>
<rect x="480" y="435" width="320" height="135" rx="18" fill="#F1F5F9" stroke="#D8E1EB"/>
<text x="500" y="471.0" font-size="25" font-weight="700" fill="#1769B8">Outbox worker</text>
<text x="500" y="511.0" font-size="23" font-weight="400" fill="#182431">Доставляет события</text>
<text x="500" y="542.05" font-size="23" font-weight="400" fill="#182431">с повторами</text>
<rect x="950" y="435" width="280" height="135" rx="18" fill="#F1F5F9" stroke="#D8E1EB"/>
<text x="970" y="471.0" font-size="25" font-weight="700" fill="#1769B8">Projection DB</text>
<text x="970" y="511.0" font-size="23" font-weight="400" fill="#182431">Inbox + сумма дельт</text>
<text x="970" y="542.05" font-size="23" font-weight="400" fill="#182431">Не разрешает продажу</text>
<polyline points="330,500 410,500 410,345 570,345 570,305" fill="none" stroke="#6A7C91" stroke-width="2.7" marker-end="url(#arrow)"/>
<polyline points="640,305 640,435" fill="none" stroke="#6A7C91" stroke-width="2.7" marker-end="url(#arrow)"/>
<text x="657" y="378.0" font-size="20" font-weight="400" fill="#1769B8">События</text>
<polyline points="800,500 950,500" fill="none" stroke="#6A7C91" stroke-width="2.7" marker-end="url(#arrow)"/>
<text x="825" y="481.0" font-size="20" font-weight="400" fill="#1769B8">Доставка</text>
<text x="50" y="629.0" font-size="23" font-weight="700" fill="#182431">Replica копирует WAL. Projection получает бизнес-события. Это разные механизмы.</text>
</g></svg>